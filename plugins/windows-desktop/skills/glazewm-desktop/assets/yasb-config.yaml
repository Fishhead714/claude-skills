# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json
# 由 glazewm-desktop 技能的 install.ps1 生成。$env:USERPROFILE 由 YASB 启动时展开。

watch_stylesheet: true
watch_config: true
debug: false
update_check: true

bars:
  primary-bar:
    enabled: true
    screens: ["*"]
    class_name: "yasb-bar"
    alignment:
      position: "top"
      align: "left"
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: true
      round_corners: false
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: "100%"
      height: 30
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left: ["glazewm_workspaces"]
      center: ["clock", "lunar"]
      right: ["local_status"]

widgets:
  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      hide_if_offline: true
      monitor_exclusive: true
      enable_scroll_switching: true

  # 时钟：时间突出、日期弱化；左键切换含年份+秒，右键弹月历
  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%m月%d日 %a  %H:%M}"
      label_alt: "{%Y-%m-%d  %H:%M:%S}"
      tooltip: true
      locale: "zh_CN"
      calendar:
        blur: true
        round_corners: true
        alignment: "center"
        direction: "down"
        show_week_numbers: true
        show_holidays: false
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "toggle_calendar"

  # 农历 + 黄历 + 八卦：左键切换 宜忌/日卦 摘要，悬停看完整干支/节气/宜忌/九宫飞星/喜财福神方位。
  # 依赖 Python + lunar_python；install.ps1 会装好并把 __PYTHON__ 换成实际路径，找不到 Python 就从 center 里去掉它
  lunar:
    type: "yasb.custom.CustomWidget"
    options:
      label: "{data[brief]}"
      label_alt: "{data[detail]}"
      label_placeholder: "农历 …"
      class_name: "lunar-widget"
      tooltip: true
      tooltip_label: "{data[tip]}"
      exec_options:
        # YASB 按空格硬切 run_cmd、不认引号：python 路径和脚本路径都不能带空格
        run_cmd: '__PYTHON__ $env:USERPROFILE\.config\yasb\scripts\lunar-yasb.py'
        run_interval: 600000
        return_format: "json"
        use_shell: false
      callbacks:
        on_left: "toggle_label"
        on_right: "do_nothing"

  # 本机负载：左键点开看明细，再点收起；悬停也显示明细
  local_status:
    type: "yasb.custom.CustomWidget"
    options:
      label: "{data[brief]}"
      label_alt: "{data[detail]}"
      label_placeholder: "local …"
      class_name: "local-widget"
      tooltip: true
      tooltip_label: "{data[detail]}"
      exec_options:
        # YASB 按空格硬切 run_cmd、不认引号：路径不能带引号，用户名里也不能有空格
        run_cmd: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File $env:USERPROFILE\.config\yasb\scripts\local-yasb.ps1'
        run_interval: 5000
        return_format: "json"
        # 不要设 encoding：YASB 自己对字节做 utf-8 解码，设了反而静默失败（一直 Loading...）
        use_shell: false
      callbacks:
        on_left: "toggle_label"
        on_right: "do_nothing"
